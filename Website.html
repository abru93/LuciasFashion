<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucias Fashion - Launching Soon</title>

<!-- Google Font (Stylish) -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
}

/* Glass Container */
.container {
    text-align: center;
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    width: 90%;
    max-width: 400px;
}

/* Logo */
.logo {
    width: 120px;
    margin-bottom: 15px;
}

/* Stylish Title */
h1 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

/* Subtitle */
p {
    font-size: 16px;
    margin-bottom: 25px;
}

/* Countdown */
.countdown {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
}

.box {
    background: rgba(255,255,255,0.6);
    padding: 15px;
    border-radius: 12px;
    width: 70px;
}

.box h2 {
    font-size: 22px;
}

.box span {
    font-size: 12px;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: #ff6f61;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff3b2f;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    width: 300px;
}

.modal input {
    width: 100%;
    padding: 10px;
    margin: 15px 0;
    border-radius: 20px;
    border: 1px solid #ccc;
}

.close {
    float: right;
    cursor: pointer;
    font-size: 20px;
}
</style>

</head>
<body>

<div class="container">
    <img src="logo.png" class="logo">

    <!-- UPDATED TITLE -->
    <h1>LUCIAS FASHION</h1>

    <!-- UPDATED TEXT -->
    <p>Official Website Launch.</p>

    <div class="countdown">
        <div class="box"><h2 id="days">00</h2><span>Days</span></div>
        <div class="box"><h2 id="hours">00</h2><span>Hours</span></div>
        <div class="box"><h2 id="minutes">00</h2><span>Minutes</span></div>
        <div class="box"><h2 id="seconds">00</h2><span>Seconds</span></div>
    </div>

    <button onclick="openModal()">Notify Me</button>
</div>

<!-- POPUP -->
<div class="modal" id="emailModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3>Get Notified</h3>
        <input type="email" id="email" placeholder="Enter your email">
        <button onclick="submitEmail()">Submit</button>
    </div>
</div>

<script>
// Countdown
const launchDate = new Date("April 10, 2026 10:00:00").getTime();

setInterval(() => {
    const now = new Date().getTime();
    const distance = launchDate - now;

    document.getElementById("days").innerText = Math.floor(distance / (1000*60*60*24));
    document.getElementById("hours").innerText = Math.floor((distance / (1000*60*60)) % 24);
    document.getElementById("minutes").innerText = Math.floor((distance / 1000/60) % 60);
    document.getElementById("seconds").innerText = Math.floor((distance / 1000) % 60);
}, 1000);

// Modal
function openModal() {
    document.getElementById("emailModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("emailModal").style.display = "none";
}

// Submit Email
function submitEmail() {
    const email = document.getElementById("email").value;

    if (email === "" || !email.includes("@")) {
        alert("Please enter a valid email!");
        return;
    }

    alert("Thanks! We'll notify you at " + email);
    closeModal();
}
</script>

</body>
</html>
